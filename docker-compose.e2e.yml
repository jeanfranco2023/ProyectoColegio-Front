services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shuji_e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?generated by run-e2e-isolated.ps1}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d shuji_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - isolated

  api:
    build:
      context: ${E2E_BACKEND_CONTEXT:?generated by run-e2e-isolated.ps1}
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      SPRING_PROFILES_ACTIVE: local-docker,e2e
      SUPABASE_DB_HOST: postgres
      SUPABASE_DB_PORT: "5432"
      SUPABASE_DB_NAME: shuji_e2e
      SUPABASE_DB_USER: e2e
      SUPABASE_DB_PASSWORD: ${E2E_DB_PASSWORD:?generated by run-e2e-isolated.ps1}
      SUPABASE_DB_SSLMODE: disable
      SUPABASE_DB_PREPARE_THRESHOLD: "0"
      HIKARI_MAX_POOL_SIZE: "5"
      HIKARI_MIN_IDLE: "1"
      JWT_SECRET: ${E2E_JWT_SECRET:?generated by run-e2e-isolated.ps1}
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: e2e@local.test
      SUPABASE_URL: http://127.0.0.1:9
      SUPABASE_SERVICE_ROLE_KEY: ""
      LOCAL_STORAGE_ROOT: /tmp/shuji-e2e-files
      LOCAL_STORAGE_PUBLIC_BASE_URL: http://127.0.0.1:${E2E_API_PORT:-18080}
      DNI_API_URL: http://127.0.0.1:9/dni?numero={dni}
      DNI_API_TOKEN: ""
      RENIEC_API_URL: http://127.0.0.1:9/dni
      RENIEC_API_TOKEN: ""
      RENIEC_FALLBACK_HABILITADO: "true"
      MERCADOPAGO_SANDBOX: "true"
      MERCADOPAGO_API_URL: http://127.0.0.1:9
      MERCADOPAGO_ACCESS_TOKEN: ""
      MERCADOPAGO_PUBLIC_KEY: ""
      MERCADOPAGO_WEBHOOK_SECRET: ""
      PAGOS_API_TOKEN: ""
      PAGOS_WEBHOOK_SECRET: ""
    depends_on:
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - isolated

  relay:
    image: python:3.12-alpine
    command:
      - python
      - -u
      - -c
      - |
        import asyncio
        async def pipe(reader, writer):
            while data := await reader.read(65536):
                writer.write(data)
                await writer.drain()
        async def forward(reader, writer):
            upstream = None
            try:
                source, upstream = await asyncio.open_connection("api", 8080)
                tasks = [asyncio.create_task(pipe(reader, upstream)),
                         asyncio.create_task(pipe(source, writer))]
                _, pending = await asyncio.wait(tasks, return_when=asyncio.FIRST_COMPLETED)
                for task in pending:
                    task.cancel()
                await asyncio.gather(*tasks, return_exceptions=True)
            except OSError:
                pass
            finally:
                if upstream:
                    upstream.close()
                writer.close()
        async def main():
            server = await asyncio.start_server(forward, "0.0.0.0", 8080)
            async with server:
                await server.serve_forever()
        asyncio.run(main())
    ports:
      - "127.0.0.1:${E2E_API_PORT:-18080}:8080"
    depends_on:
      - api
    networks:
      - isolated
      - host_access

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_DATABASE: /tmp/mailpit.db
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:18025:8025"
    networks:
      - isolated
      - host_access

networks:
  host_access: {}
  isolated:
    internal: true
